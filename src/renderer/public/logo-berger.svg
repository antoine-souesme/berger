<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 64 64" role="img" aria-label="Berger">
  <title>Berger</title>
  <rect width="64" height="64" rx="14" fill="#1e1f1c"/>
  <!-- La laine : contour seul (cercles tracés, puis remplis du fond pour ne garder que le bord) -->
  <g fill="none" stroke="#f8f8f2" stroke-width="5">
    <circle cx="20" cy="32" r="9"/>
    <circle cx="29" cy="25" r="10"/>
    <circle cx="38" cy="30" r="9"/>
    <circle cx="25" cy="39" r="8"/>
    <circle cx="35" cy="39" r="8"/>
  </g>
  <g fill="#1e1f1c">
    <circle cx="20" cy="32" r="9"/>
    <circle cx="29" cy="25" r="10"/>
    <circle cx="38" cy="30" r="9"/>
    <circle cx="25" cy="39" r="8"/>
    <circle cx="35" cy="39" r="8"/>
  </g>
  <!-- La tête : une invite de commande -->
  <rect x="38" y="24" width="17" height="19" rx="6" fill="#1e1f1c" stroke="#a6e22e" stroke-width="2.5"/>
  <path d="M43 30l4 3.5-4 3.5" fill="none" stroke="#a6e22e" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Les pattes -->
  <path d="M24 49v4M34 49v4" stroke="#f8f8f2" stroke-width="2.5" stroke-linecap="round"/>
</svg>
